name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e +o pipefail
          mkdir -p out
          pip -q install -U --pre "yt-dlp[default]"
          yt-dlp --flat-playlist --print "%(playlist_index)s | %(title)s | %(id)s | %(duration)s" "https://youtube.com/playlist?list=PLe0p3tPlFXOU" > out/pl_dur.txt 2> out/pl_err.txt
          wc -l out/pl_dur.txt; cat out/pl_dur.txt; tail -3 out/pl_err.txt
      - name: save
        if: always()
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
