name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e +o pipefail
          mkdir -p out
          pip -q install -U --pre "yt-dlp[default]"
          v=XS6mp8puy5s
          for c in tv tv_simply tv_embedded android_vr android ios web_safari web_music web_creator mweb; do
            timeout 120 yt-dlp --extractor-args "youtube:player_client=$c" -f "bestaudio/best" -o "out/t_$c.%(ext)s" "https://www.youtube.com/watch?v=$v" > out/a_$c.log 2>&1
            if ls out/t_$c.* >/dev/null 2>&1; then echo "OK $c $(ls -la out/t_$c.* | awk '{print $5}')"; else echo "NO $c: $(grep -m1 -iE 'error' out/a_$c.log | cut -c1-200)"; fi
          done
          timeout 120 yt-dlp -f "bestaudio/best" -o "out/t_music.%(ext)s" "https://music.youtube.com/watch?v=$v" > out/a_music.log 2>&1; ls out/t_music.* 2>/dev/null || grep -m1 -i error out/a_music.log | cut -c1-200
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for u in "https://t.me/s/SaudiQHC" "https://t.me/s/saudiqhc_sa" "https://soundcloud.com/saudiqhc" "https://qhc.gov.sa" "https://www.qhc.gov.sa" "https://saudiqhc.sa" "https://saudiqhc.com" "https://www.youtube.com/@SaudiQHC/about"; do echo "== $u"; curl -sSL --max-time 30 -A "$UA" "$u" -o out/x.html -w "%{http_code} %{size_download} %{url_effective}\n"; grep -oE '<title>[^<]*' out/x.html | head -1; grep -oE 'https?://[^"\\ <]*(t\.me|soundcloud|\.sa/|telegram|apps\.apple|play\.google)[^"\\ <]*' out/x.html | sort -u | head -12; done
          rm -f out/t_*
      - name: save
        if: always()
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
