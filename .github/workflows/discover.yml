name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: tools
        run: |
          sudo apt-get -qq install -y ffmpeg >/dev/null
          pip -q install -U --pre "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: try clients
        run: |
          mkdir -p out; deno --version | head -1 || true; yt-dlp --version
          v=6cPJunNtBmk
          for c in default tv tv_simply web_embedded mweb android_vr web_safari ios; do
            if [ "$c" = default ]; then a=""; else a="--extractor-args youtube:player_client=$c"; fi
            timeout 120 yt-dlp $a -f "bestaudio/best" -o "out/t_$c.%(ext)s" "https://www.youtube.com/watch?v=$v" > out/c_$c.log 2>&1 && echo "OK $c" || echo "NO $c: $(grep -m1 ERROR out/c_$c.log | cut -c1-160)"
          done
          ls -la out
      - name: save
        run: |
          rm -f out/t_*
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
