name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e +o pipefail
          sudo apt-get -qq install -y ffmpeg jq >/dev/null
          mkdir -p out
          for id in anasal-maiman Anas-Al-Miman-Mouratel; do
            curl -sSL --max-time 60 "https://archive.org/metadata/$id" -o out/meta_$id.json
            jq -c '.metadata' out/meta_$id.json
            jq -r '.files[]|select(.format|test("MP3|Ogg|AAC|M4A|Flac|WAVE|MPEG4|Opus";"i"))|[.name,.format,.size,.length]|@tsv' out/meta_$id.json | head -150
          done
          n=$(jq -r '[.files[]|select(.name|test("\\.mp3$"))][0].name' out/meta_anasal-maiman.json); echo "first: $n"
          curl -sSL --max-time 200 "https://archive.org/download/anasal-maiman/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$n")" -o a.mp3; ffprobe -v error -show_format a.mp3 | grep -E "duration|bit_rate|TAG"
      - name: save
        if: always()
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
