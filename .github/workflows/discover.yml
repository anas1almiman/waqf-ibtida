name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e +o pipefail
          mkdir -p out
          curl -sSL --max-time 60 "https://mp3quran.net/api/v3/ayat_timing/reads" -o out/reads.json; wc -c out/reads.json
          jq -c '.[]|[.id,.name,.rewaya,.folder_url]' out/reads.json | grep -viE "حفص|hafs" | head -80
          echo "total $(jq length out/reads.json)"
          curl -sSL --max-time 60 "https://mp3quran.net/api/v3/reciters?language=ar" -o out/rec.json
          jq -c '.reciters[]|.name as $n|.moshaf[]|select(.name|test("حفص")|not)|[$n,.name,.server,.surah_total]' out/rec.json | head -120
      - name: save
        if: always()
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
