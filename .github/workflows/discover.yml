name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: tools
        run: |
          sudo apt-get -qq install -y ffmpeg jq >/dev/null
          pip -q install -U --pre "yt-dlp[default]" bgutil-ytdlp-pot-provider
          docker run -d --name pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider >/dev/null 2>&1 || true
          sleep 8
      - name: playlist
        run: |
          mkdir -p out
          yt-dlp --flat-playlist --print "%(title)s | %(id)s" "https://youtube.com/playlist?list=PLe0p3tPlFXOU" > out/pl_user.txt 2> out/pl_err.txt || true
          wc -l out/pl_user.txt; head -3 out/pl_user.txt; tail -2 out/pl_err.txt
      - name: attempts
        run: |
          set +e +o pipefail
          v=XS6mp8puy5s
          try(){ n=$1; shift; timeout 150 "$@" > out/a_$n.log 2>&1 && ls out/t_$n.* >/dev/null 2>&1 && echo "OK $n $(ls -la out/t_$n.* | awk '{print $5}')" || echo "NO $n: $(grep -m1 -iE 'error|fail' out/a_$n.log | cut -c1-170)"; }
          try pot_web yt-dlp --extractor-args "youtube:player_client=web" -f "bestaudio/best" -o "out/t_pot_web.%(ext)s" "https://www.youtube.com/watch?v=$v"
          try pot_mweb yt-dlp --extractor-args "youtube:player_client=mweb" -f "bestaudio/best" -o "out/t_pot_mweb.%(ext)s" "https://www.youtube.com/watch?v=$v"
          try pot_embed yt-dlp --extractor-args "youtube:player_client=web_embedded" -f "bestaudio/best" -o "out/t_pot_embed.%(ext)s" "https://www.youtube.com/watch?v=$v"
          for inst in https://pipedapi.kavin.rocks https://pipedapi.adminforge.de https://api.piped.yt https://pipedapi.reallyaweso.me https://piped-api.privacy.com.de https://pipedapi.leptons.xyz; do
            u=$(curl -sS --max-time 25 "$inst/streams/$v" | jq -r '.audioStreams|sort_by(.bitrate)|last|.url' 2>/dev/null)
            if [ -n "$u" ] && [ "$u" != null ]; then curl -sSL --max-time 120 "$u" -o out/t_piped.bin && s=$(stat -c %s out/t_piped.bin) && echo "PIPED $inst size $s" && [ "$s" -gt 100000 ] && break; else echo "piped no: $inst"; fi
          done
          for inst in https://inv.nadeko.net https://invidious.nerdvpn.de https://yewtu.be https://invidious.f5.si https://inv.tux.pizza https://invidious.privacyredirect.com; do
            u=$(curl -sS --max-time 25 "$inst/api/v1/videos/$v" | jq -r '[.adaptiveFormats[]|select(.type|startswith("audio"))]|sort_by(.bitrate|tonumber)|last|.itag' 2>/dev/null)
            if [ -n "$u" ] && [ "$u" != null ]; then curl -sSL --max-time 120 "$inst/latest_version?id=$v&itag=$u&local=true" -o out/t_inv.bin && s=$(stat -c %s out/t_inv.bin) && echo "INV $inst itag $u size $s" && [ "$s" -gt 100000 ] && break; else echo "inv no: $inst"; fi
          done
          for inst in https://cobalt-api.kwiatekmiki.com https://capi.3kh0.net https://cobalt-backend.canine.tools https://api.cobalt.tools; do
            r=$(curl -sS --max-time 40 -X POST "$inst/" -H "Accept: application/json" -H "Content-Type: application/json" -d "{\"url\":\"https://www.youtube.com/watch?v=$v\",\"downloadMode\":\"audio\",\"audioFormat\":\"mp3\"}")
            u=$(echo "$r" | jq -r '.url' 2>/dev/null)
            if [ -n "$u" ] && [ "$u" != null ]; then curl -sSL --max-time 150 "$u" -o out/t_cobalt.bin && s=$(stat -c %s out/t_cobalt.bin) && echo "COBALT $inst size $s" && [ "$s" -gt 100000 ] && break; else echo "cobalt no: $inst $(echo $r | cut -c1-120)"; fi
          done
          ls -la out | head -30
          for f in out/t_*; do [ -f "$f" ] && ffprobe -v error -show_entries format=duration,format_name -of compact "$f" 2>&1 | head -1; done
      - name: save
        if: always()
        run: |
          rm -f out/t_*
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
