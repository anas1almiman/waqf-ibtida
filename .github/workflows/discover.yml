name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          set +e +o pipefail
          mkdir -p out
          python3 - <<'PY'
          import json,urllib.request
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'x'}),timeout=60).read()
          for repo,br in (('A7med3bdulbaset/hadith-json','main'),('rn0x/Adhkar-json','main')):
              try:
                  t=json.loads(get('https://api.github.com/repos/%s/git/trees/%s?recursive=1'%(repo,br)))
                  paths=[x['path'] for x in t['tree'] if x['type']=='blob']
                  open('out/tree-%s.txt'%repo.replace('/','_'),'w').write('\n'.join(paths))
                  for p in paths:
                      lp=p.lower()
                      if ('nawawi' in lp or 'forties' in lp or 'adhkar' in lp) and lp.endswith('.json') and 'node_modules' not in lp:
                          try:
                              b=get('https://raw.githubusercontent.com/%s/%s/%s'%(repo,br,p))
                              open('out/'+repo.split('/')[0]+'__'+p.replace('/','__'),'wb').write(b);print('ok',p,len(b))
                          except Exception as e: print('fail',p,e)
              except Exception as e: print('ERR',repo,e)
          PY
          ls -la out
      - name: save
        if: always()
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
