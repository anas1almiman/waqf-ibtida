name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: riwayat
        run: |
          mkdir -p out
          curl -sSL --max-time 60 "https://mp3quran.net/api/v3/riwayat?language=ar" -o out/riwayat.json
          curl -sSL --max-time 120 "https://mp3quran.net/api/v3/reciters?language=ar" -o out/reciters.json
          python3 - <<'E'
          import json,urllib.request
          rw=json.load(open('out/riwayat.json'))['riwayat']
          rc=json.load(open('out/reciters.json'))['reciters']
          print(len(rw),len(rc))
          res=[]
          for r in rc:
              for m in r['moshaf']:
                  res.append({'r':r['name'],'rid':r['id'],'mid':m['id'],'name':m['name'],'srv':m['server'],'n':m['surah_total'],'type':m.get('moshaf_type')})
          json.dump({'riwayat':rw,'moshaf':res},open('out/qiraat_src.json','w'),ensure_ascii=False)
          import collections
          c=collections.Counter(x['name'] for x in res if x['n']==114)
          for k,v in c.most_common(): print(v,k)
          E
          rm -f out/reciters.json
      - name: save
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
