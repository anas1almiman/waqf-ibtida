name: discover
on:
  push:
    branches: [audio-lab]
    paths: ['.github/workflows/discover.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e +o pipefail
          mkdir -p out
          python3 - <<'PY'
          import json,urllib.request,time
          R={'qalun':270,'warsh':120,'duri':269,'susi':65,'bazzi':296,'shuba':305}
          for k,rid in R.items():
              T={};cnt=[]
              for s in range(1,115):
                  for attempt in range(4):
                      try:
                          d=json.load(urllib.request.urlopen('https://mp3quran.net/api/v3/ayat_timing?surah=%d&read=%d'%(s,rid),timeout=40));break
                      except Exception as e:
                          d=None;time.sleep(2)
                  if not d: cnt.append((s,'ERR'));continue
                  T[str(s)]=[[x['ayah'],x['start_time'],x['end_time']] for x in d]
                  if s in (1,2,3,112): cnt.append((s,len(d),d[0]['ayah'],d[-1]['ayah']))
              json.dump(T,open('out/rw-%s.json'%k,'w'),separators=(',',':'))
              print(k,rid,len(T),cnt)
          PY
          ls -la out
      - name: save
        if: always()
        run: |
          git init -q pub && cd pub && git checkout -q -b discover-out && cp -r ../out . && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" discover-out
